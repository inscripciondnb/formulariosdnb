<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración · OBA 2026</title><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Staatliches&display=swap" rel="stylesheet"><style>
:root{--carbon:#16110E;--carbon2:#201914;--carbon3:#18120f;--rojo:#C8272D;--rojoOsc:#8E1B20;--dorado:#D4A94E;--doradoSuave:#E6C77E;--crema:#F3EADB;--humo:#9A8D7E;--linea:rgba(212,169,78,.25);--ok:#4CAF7D;--err:#E05252}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,rgba(200,39,45,.18),transparent 55%),radial-gradient(ellipse at 90% 100%,rgba(212,169,78,.06),transparent 50%),var(--carbon);color:var(--crema);font-family:'Barlow',sans-serif}.shell{max-width:1180px;margin:auto;padding:0 16px 40px}.hero{padding:58px 20px 34px;text-align:center;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;left:-10%;right:-10%;top:22px;height:9px;background:var(--rojo);transform:rotate(-2deg)}.hero:after{content:"";position:absolute;left:-10%;right:-10%;top:38px;height:3px;background:var(--dorado);transform:rotate(-2deg)}.eyebrow{font-family:'Staatliches';color:var(--dorado);letter-spacing:.28em;font-size:.9rem;text-transform:uppercase}.hero h1{font-family:'Staatliches';font-weight:400;font-size:clamp(2.5rem,7vw,4.4rem);letter-spacing:.03em;line-height:.95;margin:12px 0 8px}.hero p{color:var(--humo);margin:0 auto;max-width:760px;line-height:1.55}.deadline{display:inline-flex;align-items:center;gap:9px;margin-top:18px;padding:9px 14px;border:1px solid rgba(200,39,45,.55);background:rgba(200,39,45,.10);color:var(--crema);font-weight:700}.deadline strong{color:var(--doradoSuave)}
.layout{display:grid;grid-template-columns:.88fr 1.12fr;gap:18px;align-items:start}.card{background:var(--carbon2);border:1px solid var(--linea);border-top:4px solid var(--rojo);margin-top:14px}.card-title{font-family:'Staatliches';font-size:1.2rem;letter-spacing:.12em;color:var(--dorado);padding:15px 18px;border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:10px}.card-title:before{content:"";width:5px;height:24px;background:var(--rojo);flex:0 0 auto}.card-body{padding:18px}.info-card{position:sticky;top:14px}.intro{font-size:.97rem;line-height:1.65;color:#ded3c5;margin:0}.section-label{font-family:'Staatliches';font-size:1.08rem;color:var(--dorado);letter-spacing:.08em;margin:22px 0 8px}.info-list{margin:0;padding-left:20px;color:#ded3c5;line-height:1.55}.info-list li{margin:7px 0}.callout{margin-top:18px;border:1px solid var(--linea);border-left:5px solid var(--dorado);background:rgba(212,169,78,.06);padding:14px 15px;color:var(--doradoSuave);line-height:1.5}.date-box{margin-top:18px;background:rgba(200,39,45,.08);border:1px solid rgba(200,39,45,.45);padding:15px}.date-box span{display:block;color:var(--humo);font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.date-box strong{display:block;font-family:'Staatliches';font-size:1.45rem;color:var(--crema);margin-top:4px;letter-spacing:.04em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{margin-bottom:14px}label{display:block;margin-bottom:6px;color:var(--humo);font-size:.76rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em}input,select,textarea{width:100%;border:1px solid var(--linea);background:var(--carbon);color:var(--crema);padding:12px;outline:none;border-radius:0;font:inherit;font-size:16px}textarea{min-height:145px;resize:vertical;line-height:1.5}input:focus,select:focus,textarea:focus{border-color:var(--dorado);box-shadow:0 0 0 1px rgba(212,169,78,.15)}select option{background:var(--carbon);color:var(--crema)}.required{color:#ff8b91}.help{background:rgba(212,169,78,.06);border:1px solid var(--linea);border-left:4px solid var(--dorado);padding:11px 12px;color:var(--doradoSuave);font-size:.88rem;margin-bottom:14px;line-height:1.45}.counter{text-align:right;color:var(--humo);font-size:.76rem;margin-top:5px}.upload-box{border:1px dashed rgba(212,169,78,.42);background:var(--carbon);padding:20px;text-align:center;transition:.2s}.upload-box:hover,.upload-box.drag{border-color:var(--dorado);background:rgba(212,169,78,.05)}.upload-icon{font-size:2rem;line-height:1;margin-bottom:8px}.upload-title{font-weight:800;color:var(--crema)}.upload-note{color:var(--humo);font-size:.82rem;margin-top:4px}.upload-box input{margin-top:12px;padding:9px;background:#120f0d}.file-state{margin-top:10px;color:var(--doradoSuave);font-size:.84rem;word-break:break-word}.check{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--linea);background:var(--carbon);padding:13px;margin:15px 0}.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--rojo);flex:0 0 auto}.check label{margin:0;text-transform:none;letter-spacing:0;font-size:.88rem;font-weight:500;color:#d8cec0;line-height:1.45}.btn{width:100%;border:0;background:linear-gradient(160deg,var(--rojo),var(--rojoOsc));color:#fff;border-bottom:4px solid var(--dorado);font-family:'Staatliches';font-size:1.2rem;letter-spacing:.11em;padding:14px 16px;cursor:pointer}.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.55;cursor:not-allowed}.status{margin-top:12px;padding:12px;border:1px solid var(--linea);display:none;line-height:1.45}.status.ok{display:block;color:#a8e7c2;border-color:rgba(76,175,125,.35);background:rgba(76,175,125,.08)}.status.err{display:block;color:#ffb1b1;border-color:rgba(224,82,82,.35);background:rgba(224,82,82,.08)}.footer{text-align:center;color:var(--humo);font-size:.78rem;margin-top:22px;line-height:1.5}.mini-note{font-size:.8rem;color:var(--humo);margin-top:10px}.badge{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:4px 7px;border:1px solid var(--linea);color:var(--doradoSuave);margin-bottom:10px}
.multi-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.multi-option{display:flex;align-items:center;gap:11px;border:1px solid var(--linea);background:var(--carbon);padding:13px 14px;cursor:pointer;transition:.2s}.multi-option:hover{border-color:var(--dorado);background:rgba(212,169,78,.05)}.multi-option:has(input:checked){border-color:var(--rojo);background:rgba(200,39,45,.10);box-shadow:inset 4px 0 0 var(--rojo)}.multi-option input{width:19px;height:19px;margin:0;accent-color:var(--rojo);flex:0 0 auto}.multi-option span{color:var(--crema);font-weight:700;font-size:.92rem}.multi-help{color:var(--humo);font-size:.78rem;margin-top:9px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.info-card{position:static}}@media(max-width:620px){.g2,.multi-options{grid-template-columns:1fr}.shell{padding:0 10px 30px}.hero{padding-left:8px;padding-right:8px}.card-body{padding:15px}.deadline{display:flex;justify-content:center}}
.multi-options{grid-template-columns:1fr}.multi-option{align-items:flex-start;text-transform:none;letter-spacing:0}.multi-option input{margin-top:3px}.multi-option small,.multi-option em{display:block;margin-top:6px;font-size:.85rem;font-weight:500}.multi-option small{color:var(--doradoSuave)}.multi-option em{color:#c7b8a5;font-style:normal}.summary{white-space:pre-line;line-height:1.6}.hero p{color:#c7b8a5}fieldset{border:0;padding:0;margin:0}legend{position:absolute;width:1px;height:1px;overflow:hidden}.record{margin-bottom:16px;border:1px solid var(--linea);padding:16px}.record p{white-space:pre-line;overflow-wrap:anywhere}.record button{width:auto;font-size:1rem}.tools{display:flex;gap:12px;flex-wrap:wrap}.tools input{flex:1;min-width:200px}.tools button{width:auto}.record h3{margin-top:0;color:var(--dorado)}a{color:var(--dorado)}.count{padding:16px 0}</style></head><body><div class="shell"><header class="hero"><div class="eyebrow">Asamblea OBA 2026</div><h1>Administración de inscripciones</h1><p>Consulte y elimine registros de actividades recreativas.</p></header><section class="card"><div class="card-title">Acceso administrativo</div><div class="card-body"><form id="login"><label for="password">Contraseña administrativa</label><div class="tools"><input id="password" type="password" required autocomplete="current-password"><button class="btn">Ingresar</button></div></form><div id="status" class="status" role="status" aria-live="polite"></div><div id="panel" hidden><div class="tools" style="margin-top:20px"><input id="search" placeholder="Buscar por nombre, país o institución" aria-label="Buscar registros"><button class="btn" id="refresh">Actualizar</button><button class="btn" id="logout">Salir</button></div><div class="count" id="count"></div><div id="list"></div></div><p><a href="index.html">Volver al formulario</a></p></div></section></div><script>
const API_URL='https://script.google.com/macros/s/AKfycbyOVqOB68sa0eo7s22PtWBFEAkrd0Oecng3xD7xPU1Gk-6ZTvN-Lq9RfiTY8Ht8bfuJ/exec';let password='',registros=[],busy=false;
const $=id=>document.getElementById(id);function status(t,ok=false){$('status').textContent=t;$('status').className='status '+(ok?'ok':'err')}
async function api(action,extra={}){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,password,...extra})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'No se pudo completar la operación.');return d}
function render(){const q=$('search').value.toLocaleLowerCase();const filtered=registros.filter(r=>[r.nombre,r.apellido,r.pais,r.institucion].join(' ').toLocaleLowerCase().includes(q));$('list').replaceChildren();$('count').textContent=filtered.length+' de '+registros.length+' inscripciones';for(const r of filtered){const box=document.createElement('article');box.className='record';const title=document.createElement('h3');title.textContent=r.nombre+' '+r.apellido;box.append(title);const p=document.createElement('p');p.textContent='País: '+r.pais+' · Institución: '+r.institucion+'\nTeléfono: '+r.telefono+'\nActividades: '+r.actividades+(r.observaciones?'\nObservaciones: '+r.observaciones:'');box.append(p);const btn=document.createElement('button');btn.className='btn';btn.textContent='Eliminar inscripción';btn.onclick=async()=>{if(busy||!confirm('¿Eliminar definitivamente la inscripción de '+r.nombre+' '+r.apellido+'?'))return;busy=true;btn.disabled=true;try{await api('eliminar',{id:r.id});registros=registros.filter(x=>x.id!==r.id);render();status('Inscripción eliminada.',true)}catch(e){status(e.message);btn.disabled=false}finally{busy=false}};box.append(btn);$('list').append(box)}}
async function load(){if(busy)return;busy=true;$('refresh').disabled=true;try{const d=await api('listar');registros=d.registros;$('panel').hidden=false;$('login').hidden=true;$('password').value='';render();status('Listado actualizado.',true)}catch(e){status(e.message)}finally{busy=false;$('refresh').disabled=false}}
$('login').onsubmit=e=>{e.preventDefault();password=$('password').value;load()};$('refresh').onclick=load;$('search').oninput=render;$('logout').onclick=()=>{password='';registros=[];$('list').replaceChildren();$('panel').hidden=true;$('login').hidden=false;$('password').value='';$('status').className='status'};
</script></body></html>
